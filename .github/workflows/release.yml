name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Import signing certificate
        env:
          BUILD_CERT: ${{ secrets.BUILD_CERT }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$BUILD_CERT" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$BUILD_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build .app
        run: |
          # TODO: replace with xcodebuild archive once Xcode project lands.
          # For SPM-only build path, wrap the executable in a bundle here.
          swift build -c release
          mkdir -p build
          # Bundle wrapper script lives in packaging/scripts/bundle-app.sh (TBD).
          echo "build step is a placeholder until Xcode project is added"

      - name: Sign + notarize + DMG
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: ./packaging/notarize.sh

      - name: Compute SHA256
        id: sha
        run: |
          DMG=$(ls build/*.dmg | head -1)
          echo "sha=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "path=$DMG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sha.outputs.path }}
          generate_release_notes: true

      - name: Bump cask in tap (manual review)
        run: |
          echo "Update Casks/mac-vulture.rb in your homebrew tap with:"
          echo "  version: ${{ github.ref_name }}"
          echo "  sha256:  ${{ steps.sha.outputs.sha }}"
